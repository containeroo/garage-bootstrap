# Copy to secret.yaml, replace placeholders, and do not commit the result.
apiVersion: v1
kind: Secret
metadata:
  name: garage-bootstrap
  namespace: garage
type: Opaque
stringData:
  admin-token: REPLACE_WITH_SCOPED_ADMIN_TOKEN
  bootstrap.yaml: |
    users:
      - accessKey: GKEXAMPLEBACKUP
        secretKey: REPLACE_WITH_SECRET
        policy: db-backup
    policies:
      - name: db-backup
        buckets:
          - name: db-backups
            read: true
            write: true
    buckets:
      - name: db-backups
