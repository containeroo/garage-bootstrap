apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-bootstrap
  namespace: garage
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: garage-bootstrap
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: garage-bootstrap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage-bootstrap
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage-bootstrap
          image: ghcr.io/containeroo/garage-bootstrap:latest # Replace with your built image.
          args:
            - --admin-url=http://garage-admin.garage.svc.cluster.local:3903
            - --config=/config/bootstrap.yaml
          env:
            - name: GARAGE_BOOTSTRAP_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-bootstrap
                  key: admin-token
          ports:
            - name: health
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: bootstrap-config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap-config
          secret:
            secretName: garage-bootstrap
            items:
              - key: bootstrap.yaml
                path: bootstrap.yaml
                mode: 0440
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
